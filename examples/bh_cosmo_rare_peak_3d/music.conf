# MUSIC2 ICs for the controlled high-z rare-peak BH experiment.
# Box: 0.5 cMpc/h.  Quick-scout unigrid: 64^3 parent DM particles.
# sigma_8=1.2 is moderately boosted relative to the fiducial cosmology:
# this remains an intentionally overdense/early-structure scout, not an abundance run.

[setup]
boxlength          = 0.5
zstart             = 49
levelmin           = 6
levelmin_TF        = 6
levelmax           = 6
padding            = 8
ref_center         = 0.5, 0.5, 0.5
ref_extent         = 0.4, 0.4, 0.4
align_top          = no
baryons            = no
use_2LPT           = yes

[cosmology]
Omega_m            = 0.31
Omega_L            = 0.69
w_0                = -1.0
w_a                = 0.0
Omega_b            = 0.048
H0                 = 68.0
sigma_8            = 1.2
n_s                = 0.96
transfer            = eisenstein

[random]
seed[6]            = 12345

[output]
format              = arepo
filename            = ics.hdf5
arepo_unitlength    = 3.085678e21
arepo_unitmass      = 1.989e43
arepo_unitvel       = 1.0e5
arepo_num_files     = 1
arepo_doubleprec    = yes
